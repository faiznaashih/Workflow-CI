name: CI - MLflow Training Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train:
    name: Train Model with MLflow
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.13.0 pandas==2.2.2 numpy==1.26.4 \
                      scikit-learn==1.4.2 matplotlib==3.8.4 dagshub==0.3.25

      # 4. Run MLflow Project
      - name: Run MLflow Project
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          cd MLProject
          mlflow run . --env-manager=local

      # 5. Simpan artefak ke GitHub
      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts-${{ github.run_number }}
          path: |
            MLProject/confusion_matrix.png
            MLProject/roc_curve.png
            MLProject/classification_report.txt
          if-no-files-found: ignore

      # 6. Commit artefak ke repo
      - name: Commit Artifacts
        uses: EndBug/add-and-commit@v9
        with:
          author_name: 'GitHub Actions'
          author_email: 'actions@github.com'
          message: '[CI] Auto-training artifacts - Run #${{ github.run_number }}'
          add: |
            MLProject/confusion_matrix.png
            MLProject/roc_curve.png
            MLProject/classification_report.txt
          push: true
